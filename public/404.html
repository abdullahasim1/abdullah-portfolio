<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#F8FAFF" />
    <title>404 — Page Not Found | Abdullah Asim</title>
    <link rel="stylesheet" href="/fonts.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F8FAFF;
        color: #334155;
        font-family: "Inter", system-ui, sans-serif;
        position: relative;
        overflow: hidden;
        padding: 24px;
      }
      .glow {
        position: fixed;
        border-radius: 9999px;
        filter: blur(110px);
        pointer-events: none;
      }
      .glow-1 { width: 420px; height: 420px; background: rgba(167,139,250,0.22); top: -140px; right: -100px; }
      .glow-2 { width: 380px; height: 380px; background: rgba(232,121,249,0.14); bottom: -160px; left: -120px; }
      main { position: relative; text-align: center; max-width: 560px; }
      .code {
        font-family: "Space Grotesk", "Inter", sans-serif;
        font-size: clamp(92px, 18vw, 132px);
        font-weight: 800;
        line-height: 1;
        color: transparent;
        -webkit-text-stroke: 2px rgba(124,58,237,0.45);
      }
      h1 {
        font-family: "Space Grotesk", "Inter", sans-serif;
        font-size: clamp(26px, 5vw, 34px);
        font-weight: 800;
        color: #0F172A;
        margin-top: 18px;
        letter-spacing: -0.01em;
      }
      p { margin-top: 12px; line-height: 1.7; color: #64748B; }
      .actions { margin-top: 30px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      .btn-primary {
        display: inline-block;
        background: linear-gradient(120deg, #7C3AED, #6366F1);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        padding: 13px 28px;
        border-radius: 999px;
        box-shadow: 0 14px 28px -12px rgba(124,58,237,0.6);
      }
      .btn-ghost {
        display: inline-block;
        background: #fff;
        border: 1px solid #DDD6FE;
        color: #6D28D9;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        padding: 13px 28px;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="glow glow-1" aria-hidden="true"></div>
    <div class="glow glow-2" aria-hidden="true"></div>
    <main>
      <div class="code">404</div>
      <h1>This page doesn't exist</h1>
      <p>The link may be broken or the page moved. Let's get you back to the good stuff.</p>
      <div class="actions">
        <a class="btn-primary" href="/">Back to Home</a>
        <a class="btn-ghost" href="/projects">View Projects</a>
      </div>
    </main>
  </body>
</html>
