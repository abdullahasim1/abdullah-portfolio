<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#05060a" />
    <title>404 — Page Not Found | Abdullah Asim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #05060a;
        color: #e2e8f0;
        font-family: "Inter", system-ui, sans-serif;
        overflow: hidden;
        position: relative;
      }
      .glow {
        position: fixed;
        border-radius: 9999px;
        filter: blur(120px);
        pointer-events: none;
      }
      .glow-1 { width: 480px; height: 480px; background: rgba(34,211,238,0.08); top: -160px; left: -120px; }
      .glow-2 { width: 520px; height: 520px; background: rgba(139,92,246,0.1); bottom: -180px; right: -140px; }
      .grid {
        position: fixed; inset: 0;
        background-image:
          linear-gradient(rgba(148,163,184,0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148,163,184,0.05) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      }
      .box {
        position: relative; z-index: 1;
        text-align: center;
        padding: 24px;
      }
      .code {
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(88px, 22vw, 168px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.04em;
        background: linear-gradient(90deg, #22d3ee, #818cf8, #c084fc);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .code span { display: inline-block; animation: float 3.4s ease-in-out infinite; }
      .code span:nth-child(2) { animation-delay: 0.35s; }
      .code span:nth-child(3) { animation-delay: 0.7s; }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      h1 {
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(20px, 4vw, 28px);
        font-weight: 700;
        margin-top: 8px;
        color: #f8fafc;
      }
      p { color: #94a3b8; margin-top: 12px; font-size: 15px; }
      .actions { margin-top: 32px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
      a.btn {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 14px 28px;
        border-radius: 14px;
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        transition: all 0.25s ease;
      }
      .btn-primary {
        background: linear-gradient(90deg, #06b6d4, #7c3aed);
        color: #fff;
        box-shadow: 0 0 28px rgba(34,211,238,0.22);
      }
      .btn-primary:hover { filter: brightness(1.15); }
      .btn-ghost {
        border: 1px solid rgba(255,255,255,0.1);
        color: #e2e8f0;
      }
      .btn-ghost:hover { border-color: rgba(34,211,238,0.4); color: #67e8f9; }
    </style>
  </head>
  <body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="grid"></div>

    <main class="box">
      <div class="code"><span>4</span><span>0</span><span>4</span></div>
      <h1>Lost in the void</h1>
      <p>This page doesn't exist — but my best work does.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Back to Portfolio</a>
        <a class="btn btn-ghost" href="https://github.com/abdullahasim1">GitHub</a>
      </div>
    </main>
  </body>
</html>
