<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="AWS Certification">
  <defs>
    <linearGradient id="aws-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#232f3e"/>
      <stop offset="100%" style="stop-color:#131921"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="12" fill="url(#aws-bg)"/>
  <text x="200" y="80" text-anchor="middle" fill="#ff9900" font-family="system-ui,sans-serif" font-size="28" font-weight="700">aws</text>
  <text x="200" y="130" text-anchor="middle" fill="#ffffff" font-family="system-ui,sans-serif" font-size="18" font-weight="600">Certified Cloud Practitioner</text>
  <rect x="60" y="160" width="280" height="2" fill="#ff9900" opacity="0.6"/>
  <text x="200" y="200" text-anchor="middle" fill="#aab7b8" font-family="system-ui,sans-serif" font-size="13">Add your certificate photo as</text>
  <text x="200" y="222" text-anchor="middle" fill="#ff9900" font-family="monospace" font-size="12">public/certifications/aws-cert.jpg</text>
  <circle cx="200" cy="260" r="18" fill="none" stroke="#ff9900" stroke-width="2"/>
  <path d="M192 260 l6 6 12-12" fill="none" stroke="#ff9900" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
